[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nhbot"
version = "0.1.0"
description = "A rule-based NetHack auto-player on the NetHack Learning Environment (NLE)."
requires-python = ">=3.11"
dependencies = ["nle==1.3.0", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
nhbot = "nhbot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "SIM", "C90", "PT", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 6

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["nle", "nle.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --import-mode=importlib"
