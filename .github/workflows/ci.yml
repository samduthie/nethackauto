name: NetHack bot

on:
  push:
    paths: ["nethack/**", ".github/workflows/nethack.yml"]
  pull_request:
    paths: ["nethack/**", ".github/workflows/nethack.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nethack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: nethack/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
